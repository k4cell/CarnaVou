<p class="aviso">Dados de exemplo: nenhum bloco daqui existe de verdade.</p>

<ul class="lista">
  @for (banner of banners; track banner.id) {
    <li>
      <article class="banner" [class]="'estilo-' + banner.estilo">
        <time class="data" [attr.datetime]="banner.data">
          <span class="semana">{{ banner.semana }}</span>
          <span class="dia">{{ banner.dia }}</span>
          <span class="mes">{{ banner.mes }}</span>
        </time>

        <div class="info">
          <h2 class="nome">{{ banner.nome }}</h2>
          <p class="local">{{ banner.local }}</p>
          <p class="atracoes">{{ banner.atracoes }}</p>
          <p class="horario">{{ banner.horario }}</p>
        </div>
      </article>
    </li>
  }
</ul>
