<h2 class="titulo">Em destaque</h2>

<ul class="lista">
  @for (item of itens; track item.id) {
    <li>
      <a class="cartao" [routerLink]="['/local', item.id]">
        <span class="texto">
          <strong class="nome">{{ item.nome }}</strong>
          <app-zona-tag [zona]="item.zona" />
          @if (item.principal) {
            <span class="artistas">Artistas: <strong class="principal">{{ item.principal }}</strong>{{ item.resto }}</span>
          }
        </span>
        <span class="seta" aria-hidden="true">›</span>
      </a>
    </li>
  }
</ul>
