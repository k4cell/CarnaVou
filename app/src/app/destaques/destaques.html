<app-abas-do-dia />

<h2 class="titulo">
  Em alta
  <!-- Ícone de chama: Lucide (licença ISC). -->
  <svg class="chama" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
    />
  </svg>
</h2>

@if (cartoes().length === 0) {
  <p class="vazio">{{ mensagemVazia() }}</p>
} @else {
  <ul class="lista">
    @for (cartao of cartoes(); track cartao.local.id) {
      <li>
        <a class="cartao" [attr.data-faixa]="cartao.faixa" [routerLink]="['/local', cartao.local.id]">
          <span class="texto">
            <span class="cabeca">
              <strong class="nome">{{ cartao.local.nome }}</strong>
              <span class="selo">{{ cartao.selo }}</span>
            </span>
            <app-zona-tag [zona]="cartao.local.zona" />
            @if (cartao.principal) {
              <span class="artistas">{{ cartao.rotulo }}: <strong class="principal">{{ cartao.principal }}</strong>{{ cartao.resto }}</span>
            }
          </span>
          <span class="seta" aria-hidden="true">›</span>
        </a>
      </li>
    }
  </ul>
}
