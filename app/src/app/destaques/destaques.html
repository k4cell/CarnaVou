<app-abas-do-dia />
<app-cartao-da-fase />

<h2 class="titulo">Principais lugares</h2>

@if (cartoes().length === 0) {
  <p class="vazio">{{ mensagemVazia() }}</p>
} @else {
  <ul class="lista">
    @for (cartao of cartoes(); track cartao.local.id) {
      <li>
        <a class="cartao" [attr.data-faixa]="cartao.faixa" [routerLink]="['/local', cartao.local.id]">
          <span class="texto">
            <span class="cabeca">
              <strong class="nome">{{ cartao.local.nome }}</strong>
              <span class="selo" [attr.data-selo]="cartao.tipoDoSelo">{{ cartao.selo }}</span>
            </span>
            <app-zona-tag [zona]="cartao.local.zona" />
            @if (cartao.principal) {
              <span class="nomes">{{ cartao.rotulo }}: <strong class="principal">{{ cartao.principal }}</strong>{{ cartao.resto }}</span>
            }
          </span>
          <span class="seta" aria-hidden="true">›</span>
        </a>
      </li>
    }
  </ul>
}
