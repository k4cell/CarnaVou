<a
  class="cartao banner"
  [class.cancelado]="bloco().cancelado"
  [attr.data-faixa]="faixa()"
  [routerLink]="['/local', bloco().localId, bloco().id]"
>
  <!-- No cartão de um dia, a data fica uma vez só, na coluna da esquerda do cartão. -->
  @if (mostrarData()) {
    <app-data-do-dia [data]="bloco().data" />
  }

  <span class="info">
    <!-- O selo de megabloco e o aviso de que o bloco está rolando ficam ao lado do nome (ou embaixo, se não couber). -->
    <span class="linha-do-nome">
      <strong class="nome">{{ bloco().nome }}</strong>
      @if (bloco().megabloco) {
        <span class="selo-megabloco">Megabloco</span>
      }
      @if (selo() === 'agora') {
        <span class="rolando">Rolando agora</span>
      }
    </span>
    @if (atracoes()) {
      <span class="atracoes">{{ atracoes() }}</span>
    }
    <span class="horario" [attr.data-selo]="selo()">{{ horario() }}</span>
    @if (lugar(); as onde) {
      <span class="lugar">{{ onde }}</span>
    }
  </span>

  <span class="seta" aria-hidden="true">›</span>
</a>
<!-- Fora do link: tocar na estrela marca o bloco, sem abrir a página dele. -->
<app-botao-favorito [bloco]="bloco()" />
