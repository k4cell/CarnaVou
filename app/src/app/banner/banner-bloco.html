<a class="cartao banner" [attr.data-faixa]="faixa()" [routerLink]="['/local', bloco().localId, bloco().id]">
  <time class="data" [attr.datetime]="bloco().data">
    <span class="semana">{{ data().semana }}</span>
    <span class="dia">{{ data().dia }}</span>
    <span class="mes">{{ data().mes }}</span>
  </time>

  <span class="info">
    <strong class="nome">{{ bloco().nome }}</strong>
    @if (atracoes()) {
      <span class="atracoes">{{ atracoes() }}</span>
    }
    <span class="horario">{{ horario() }}</span>
    @if (lugar(); as onde) {
      <span class="lugar">{{ onde }}</span>
    }
  </span>

  <span class="seta" aria-hidden="true">›</span>
</a>
