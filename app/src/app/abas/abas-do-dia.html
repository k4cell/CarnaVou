<div class="abas" role="group" aria-label="Filtrar por dia">
  @for (aba of abas; track aba.id) {
    <button type="button" class="aba" [attr.aria-pressed]="ativa() === aba.id" (click)="escolher(aba.id)">
      {{ aba.nome }}
    </button>
  }
</div>

@if (simulado()) {
  <p class="teste">Data de teste: {{ dataDeTeste() }}</p>
}
