<!-- No mapa, o foco é o mapa: ele ocupa a tela toda, sem o cabeçalho. -->
@if (!noMapa()) {
<header class="topo">
  <div class="miolo linha-do-topo">
    @if (voltar(); as volta) {
      <a class="voltar" [attr.href]="enderecoDe(volta)" [attr.aria-label]="'Voltar para ' + volta.nome" (click)="aoVoltar($event, volta)">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" /></svg>
      </a>
    }
    <h1 class="marca">
      <a routerLink="/">
        <!-- WebP é bem mais leve; o PNG fica para navegador antigo. -->
        <picture>
          <source srcset="logo/emblema.webp" type="image/webp" />
          <img class="emblema" src="logo/emblema.png" alt="" width="48" height="56" />
        </picture>
        <picture>
          <source srcset="logo/palavra.webp" type="image/webp" />
          <img class="palavra" src="logo/palavra.png" alt="CarnaVou" width="160" height="37" />
        </picture>
      </a>
    </h1>
    <!-- Sempre na página, para o leitor de tela avisar quando o texto aparece. -->
    <span class="sem-internet" role="status" [class.visivel]="conexao.aviso()">{{ conexao.aviso() }}</span>
  </div>
  <div class="miolo">
    <app-aviso-de-teste />
  </div>
</header>
}

<main class="miolo corpo">
  <router-outlet />
  <!-- O mapa ocupa a tela toda e já tem os créditos dele: lá o rodapé não aparece. -->
  @if (!noMapa()) {
    <app-rodape />
  }
</main>

<app-aviso-de-atualizacao />
<app-aviso-de-navegacao />
<app-aviso-de-pronto />
<!-- No mapa, o convite cobriria o cartão do ponto: lá ele não aparece. -->
@if (!noMapa()) {
  <app-aviso-de-instalar />
}
<app-menu-inferior />
