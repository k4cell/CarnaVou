# Publica o CarnaVou a cada push na main, no GitHub Pages (https://k4cell.github.io/CarnaVou/) e na
# Cloudflare Pages (https://carnavou-teste.pages.dev/).
# Roda os testes antes: se algum falhar, os sites no ar continuam os anteriores.
name: Publicar o site

on:
  push:
    branches: [main]
  # Também dá para publicar na mão, pela aba Actions do GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um push novo cancela a publicação que ainda estiver no meio.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # A data dos dados vem do histórico: o último commit que mexeu neles.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Testes
        run: npx ng test --no-watch

      # Os testes acima usam a cópia congelada de 2026; este confere os dados que vão para o ar.
      - name: Conferir os dados que vão para o ar
        run: npx ng test --no-watch --configuration dados-reais

      - name: Carimbar a data dos dados e o número da versão
        run: node ../scripts/publicar/carimbar.mjs

      # O site mora em /CarnaVou/ (veja a configuração github-pages no angular.json).
      - name: Montar o site
        run: npx ng build --configuration production,github-pages

      # 404.html: endereço que não existe abre o site, que manda para o início.
      # .nojekyll: o GitHub Pages entrega os arquivos como estão, sem processar.
      - name: Ajustes do GitHub Pages
        run: |
          cp dist/app/browser/index.csr.html dist/app/browser/404.html
          touch dist/app/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/app/browser

      # Na Cloudflare o site mora na raiz do endereço, então a montagem é outra.
      # 404.html: endereço que não existe abre o site, que manda para o início.
      # _headers: o endereço .pages.dev fica fora dos buscadores.
      - name: Montar o site para a Cloudflare
        run: |
          npx ng build --configuration production
          cp dist/app/browser/index.csr.html dist/app/browser/404.html
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/app/browser/_headers

      - uses: actions/upload-artifact@v4
        with:
          name: site-cloudflare
          path: app/dist/app/browser

  publicar-na-cloudflare:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJETO: carnavou-teste
      WRANGLER: wrangler@4.151.3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: site-cloudflare
          path: site

      # Cria o projeto na primeira vez. Depois ele já existe, e esse erro não importa:
      # se o projeto faltar de verdade, a publicação abaixo falha.
      - name: Criar o projeto na Cloudflare
        run: npx --yes "$WRANGLER" pages project create "$PROJETO" --production-branch main || true

      - name: Publicar na Cloudflare
        run: npx --yes "$WRANGLER" pages deploy site --project-name "$PROJETO" --branch main --commit-dirty=true

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
